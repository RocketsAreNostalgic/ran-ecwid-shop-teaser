name: Reconcile v1.2.3

on:
    workflow_dispatch:

permissions: {}

concurrency:
    group: release-please-main
    cancel-in-progress: false

env:
    RAN_HISTORICAL_COMMIT: adfb601b7c8cb899310bad0d46c90e0c522f63d9
    RAN_RELEASE_HEAD: 09e37fdc5df7f52f4d6da487c69bf21ab3162f3a
    RAN_RELEASE_TREE: 4fd474af152c5944db2e6ef8b1a86ddcbdd4d9ff
    RAN_RELEASE_PR: '11'
    RAN_RELEASE_TAG: v1.2.3
    RAN_RELEASE_VERSION: 1.2.3

jobs:
    rebuild:
        name: Rebuild exact historical v1.2.3 source
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions: {}
        steps:
            - name: Check out exact historical source without repository credentials
              shell: bash
              run: |
                  set -euo pipefail
                  git init .
                  git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
                  git -c protocol.version=2 fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
                  git merge-base --is-ancestor "$RAN_HISTORICAL_COMMIT" refs/remotes/origin/main
                  git checkout --detach "$RAN_HISTORICAL_COMMIT"
                  test "$(git rev-parse HEAD)" = "$RAN_HISTORICAL_COMMIT"
                  test "$(git rev-parse 'HEAD^{tree}')" = "$RAN_RELEASE_TREE"
                  test "$(jq -er '."."' .release-please-manifest.json)" = "$RAN_RELEASE_VERSION"

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: '24.11.0'

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.5.2
                  run_install: false

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  extensions: zip
                  tools: composer:v2, wp-cli
                  coverage: none

            - name: Qualify historical source and rebuild canonical assets
              shell: bash
              run: |
                  set -euo pipefail
                  pnpm install --frozen-lockfile
                  composer install --no-interaction --prefer-dist --no-progress
                  pnpm check
                  pnpm check:generated
                  composer lint
                  composer lint:compat

                  bash scripts/create-release-assets.sh "$RAN_RELEASE_TAG"
                  archive="dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip"
                  checksum="${archive}.sha256"
                  manifest="dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json"
                  archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"

                  jq -e \
                      --arg archive "$(basename "$archive")" \
                      --arg commit "$RAN_HISTORICAL_COMMIT" \
                      --arg sha256 "$archive_sha256" \
                      --arg tag "$RAN_RELEASE_TAG" \
                      --arg version "$RAN_RELEASE_VERSION" \
                      '.schemaVersion == 1 and .archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
                      "$manifest" >/dev/null
                  printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
                  (cd dist && sha256sum --check --strict "$(basename "$checksum")")
                  unzip -tqq "$archive"

            - name: Upload exact historical reconciliation assets
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ran-ecwid-v1.2.3-reconciliation-${{ github.run_id }}
                  path: |
                      dist/ran-ecwid-shop-teaser-1.2.3.zip
                      dist/ran-ecwid-shop-teaser-1.2.3.zip.sha256
                      dist/ran-ecwid-shop-teaser-1.2.3.manifest.json
                  if-no-files-found: error
                  overwrite: true
                  retention-days: 7

    compatibility:
        name: Historical v1.2.3 / PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
        needs: rebuild
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions: {}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.0'
                      wordpress: '6.5'
                      plugin_check: false
                    - php: '8.3'
                      wordpress: '7.0.3'
                      plugin_check: true
        services:
            mysql:
                image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
                env:
                    MYSQL_DATABASE: wordpress_test
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        steps:
            - name: Check out exact historical source without repository credentials
              shell: bash
              run: |
                  set -euo pipefail
                  git init .
                  git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
                  git -c protocol.version=2 fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
                  git merge-base --is-ancestor "$RAN_HISTORICAL_COMMIT" refs/remotes/origin/main
                  git checkout --detach "$RAN_HISTORICAL_COMMIT"
                  test "$(git rev-parse HEAD)" = "$RAN_HISTORICAL_COMMIT"
                  test "$(git rev-parse 'HEAD^{tree}')" = "$RAN_RELEASE_TREE"

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: mysqli, zip
                  tools: composer:v2, wp-cli

            - run: composer install --no-interaction --prefer-dist --no-progress

            - name: Download exact historical reconciliation assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ran-ecwid-v1.2.3-reconciliation-${{ github.run_id }}
                  path: dist

            - name: Verify historical archive identity
              shell: bash
              run: |
                  set -euo pipefail
                  archive="dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip"
                  manifest="dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json"
                  test "$(jq -er '.commit' "$manifest")" = "$RAN_HISTORICAL_COMMIT"
                  test "$(jq -er '.tag' "$manifest")" = "$RAN_RELEASE_TAG"
                  test "$(jq -er '.version' "$manifest")" = "$RAN_RELEASE_VERSION"
                  (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
                  unzip -tqq "$archive"

            - name: Install WordPress integration-test environment
              shell: bash
              run: |
                  curl --fail --location --silent --show-error --output /tmp/install-wp-tests.sh \
                      https://raw.githubusercontent.com/wp-cli/scaffold-command/4a464898bf96f9d5e19e9f04957a702bf9bdc191/templates/install-wp-tests.sh
                  bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "${{ matrix.wordpress }}" true

            - name: Run WordPress integration tests
              run: composer test

            - name: Install and activate historical release ZIP in fresh WordPress
              shell: bash
              run: |
                  set -euo pipefail
                  archive_path="${GITHUB_WORKSPACE}/dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip"
                  fresh_root="/tmp/ran-ecwid-v123-wordpress-${{ matrix.php }}"
                  wp core download --path="$fresh_root" --version="${{ matrix.wordpress }}"
                  wp config create --path="$fresh_root" --dbname=ran_ecwid_v123 --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
                  wp db create --path="$fresh_root"
                  wp core install --path="$fresh_root" --url=http://localhost --title='RAN Ecwid v1.2.3 reconciliation' --admin_user=admin --admin_password=reconciliation-test-password --admin_email=admin@example.test
                  wp plugin install "$archive_path" --path="$fresh_root" --activate
                  wp plugin is-active ran-ecwid-shop-teaser --path="$fresh_root"
                  test "$(wp plugin get ran-ecwid-shop-teaser --field=version --path="$fresh_root")" = "$RAN_RELEASE_VERSION"
                  if [[ '${{ matrix.plugin_check }}' == true ]]; then
                      wp plugin install plugin-check --path="$fresh_root" --activate
                      wp plugin check ran-ecwid-shop-teaser --path="$fresh_root"
                  fi

    publish:
        name: Publish and read back missing v1.2.3
        needs:
            - rebuild
            - compatibility
        if: >-
            ${{ always()
                    && needs.rebuild.result == 'success'
                    && needs.compatibility.result == 'success'
                    && github.event_name == 'workflow_dispatch'
                    && github.ref == 'refs/heads/main' }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            actions: read
            contents: write
            issues: write
            pull-requests: read
        steps:
            - name: Download exact qualified historical assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ran-ecwid-v1.2.3-reconciliation-${{ github.run_id }}
                  path: dist

            - name: Prove exact historical identity and require owner-created tag
              id: identity
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_TRIGGER_SHA: ${{ github.sha }}
              shell: bash
              run: |
                  set -euo pipefail
                  live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
                  test "$live_main" = "$RAN_TRIGGER_SHA"

                  release_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RAN_RELEASE_PR}")"
                  jq -e \
                      --arg merge "$RAN_HISTORICAL_COMMIT" \
                      --arg head "$RAN_RELEASE_HEAD" \
                      --arg repository "$GITHUB_REPOSITORY" \
                      '.merged_at != null
                        and .base.ref == "main"
                        and .head.sha == $head
                        and .merge_commit_sha == $merge
                        and .head.ref == "release-please--branches--main--components--ran-ecwid-shop-teaser"
                        and .head.repo.full_name == $repository
                        and .user.login == "github-actions[bot]"' \
                      <<< "$release_pr" >/dev/null

                  test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${RAN_HISTORICAL_COMMIT}" --jq '.tree.sha')" = "$RAN_RELEASE_TREE"
                  test "$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${RAN_RELEASE_HEAD}" --jq '.tree.sha')" = "$RAN_RELEASE_TREE"
                  manifest_version="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.release-please-manifest.json?ref=${RAN_TRIGGER_SHA}" --jq '.content' | tr -d '\n' | base64 -d | jq -er '."."')"
                  test "$manifest_version" = "$RAN_RELEASE_VERSION"

                  archive="dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip"
                  checksum="${archive}.sha256"
                  manifest="dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json"
                  archive_sha256="$(sha256sum "$archive" | awk '{print $1}')"
                  jq -e \
                      --arg archive "$(basename "$archive")" \
                      --arg commit "$RAN_HISTORICAL_COMMIT" \
                      --arg sha256 "$archive_sha256" \
                      --arg tag "$RAN_RELEASE_TAG" \
                      --arg version "$RAN_RELEASE_VERSION" \
                      '.schemaVersion == 1 and .archive == $archive and .commit == $commit and .sha256 == $sha256 and .tag == $tag and .version == $version' \
                      "$manifest" >/dev/null
                  printf '%s  %s\n' "$archive_sha256" "$(basename "$archive")" | cmp -s - "$checksum"
                  (cd dist && sha256sum --check --strict "$(basename "$checksum")")
                  unzip -tqq "$archive"

                  tag_response="${RUNNER_TEMP}/ran-ecwid-v123-tag-ref.json"
                  tag_http_status="$(
                      curl --silent --show-error \
                          --output "$tag_response" \
                          --write-out '%{http_code}' \
                          -H "Authorization: Bearer ${GH_TOKEN}" \
                          -H 'Accept: application/vnd.github+json' \
                          -H 'X-GitHub-Api-Version: 2022-11-28' \
                          "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_RELEASE_TAG}"
                  )"
                  case "$tag_http_status" in
                      200)
                          tag_ref="$(cat "$tag_response")"
                          ;;
                      404)
                          echo "::notice::Historical v1.2.3 is fully qualified and awaiting exact owner-created tag ${RAN_RELEASE_TAG} at ${RAN_HISTORICAL_COMMIT}."
                          echo 'state=awaiting-tag' >> "$GITHUB_OUTPUT"
                          {
                              echo '### v1.2.3 reconciliation'
                              echo
                              echo '- Historical source and release assets qualified successfully.'
                              echo '- PHPCompatibility, WordPress 6.5, WordPress 7.0.3, fresh-install, and Plugin Check proof succeeded.'
                              echo "- Awaiting exact owner-created tag \`${RAN_RELEASE_TAG}\` at \`${RAN_HISTORICAL_COMMIT}\`."
                              echo '- After the tag exists, rerun only this publisher job; it will re-prove the exact tag before any release mutation.'
                          } >> "$GITHUB_STEP_SUMMARY"
                          exit 0
                          ;;
                      *)
                          echo "::error::Unable to read exact historical tag state (HTTP ${tag_http_status})."
                          cat "$tag_response" >&2
                          exit 1
                          ;;
                  esac

                  resolve_tag_commit() {
                      local ref_json=$1
                      local object_type object_sha tag_object peel_count=0
                      object_type="$(jq -er '.object.type' <<< "$ref_json")"
                      object_sha="$(jq -er '.object.sha' <<< "$ref_json")"
                      while [[ "$object_type" == tag ]]; do
                          ((peel_count += 1))
                          test "$peel_count" -le 8
                          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
                          if [[ "$peel_count" -eq 1 ]]; then
                              test "$(jq -er '.tag' <<< "$tag_object")" = "$RAN_RELEASE_TAG"
                          fi
                          object_type="$(jq -er '.object.type' <<< "$tag_object")"
                          object_sha="$(jq -er '.object.sha' <<< "$tag_object")"
                      done
                      test "$object_type" = commit
                      printf '%s\n' "$object_sha"
                  }
                  test "$(resolve_tag_commit "$tag_ref")" = "$RAN_HISTORICAL_COMMIT"

                  expected_names="$(
                      printf '%s\n' \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json" \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip" \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip.sha256" \
                          | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
                  )"

                  if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}" 2>/dev/null)"; then
                      jq -e \
                          --arg tag "$RAN_RELEASE_TAG" \
                          --arg commit "$RAN_HISTORICAL_COMMIT" \
                          '.tag_name == $tag and .target_commitish == $commit and .prerelease == false' \
                          <<< "$release_json" >/dev/null
                      asset_names="$(jq -c '[.assets[].name]' <<< "$release_json")"
                      test "$(jq 'length' <<< "$asset_names")" = "$(jq 'unique | length' <<< "$asset_names")"
                      test "$(jq -c --argjson expected "$expected_names" '[.[] | select(. as $name | $expected | index($name) | not)]' <<< "$asset_names")" = '[]'
                      release_id="$(jq -er '.id' <<< "$release_json")"
                      echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
                      if [[ "$(jq -er '.draft' <<< "$release_json")" == true ]]; then
                          state=draft
                      else
                          state=published
                      fi
                  else
                      state=tagged
                  fi

                  labels="$(jq -c '[.labels[].name]' <<< "$release_pr")"
                  pending="$(jq -r 'index("autorelease: pending") != null' <<< "$labels")"
                  tagged_label="$(jq -r 'index("autorelease: tagged") != null' <<< "$labels")"
                  case "$state" in
                      tagged|draft)
                          test "$pending" = true
                          test "$tagged_label" = false
                          ;;
                      published)
                          if [[ "$pending" != true && "$tagged_label" != true ]]; then
                              echo '::error::Published v1.2.3 PR has neither Release Please lifecycle label.'
                              exit 1
                          fi
                          ;;
                  esac
                  echo "state=$state" >> "$GITHUB_OUTPUT"

            - name: Create exact draft release from the pre-existing verified tag
              id: create
              if: steps.identity.outputs.state == 'tagged'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  release_json="$(
                      jq -nc \
                          --arg tag "$RAN_RELEASE_TAG" \
                          --arg target "$RAN_HISTORICAL_COMMIT" \
                          '{tag_name: $tag, target_commitish: $target, name: $tag, draft: true, prerelease: false, generate_release_notes: true}' \
                          | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input -
                  )"
                  release_id="$(jq -er '.id' <<< "$release_json")"
                  test "$(jq -er '.tag_name' <<< "$release_json")" = "$RAN_RELEASE_TAG"
                  test "$(jq -er '.target_commitish' <<< "$release_json")" = "$RAN_HISTORICAL_COMMIT"
                  test "$(jq -er '.draft' <<< "$release_json")" = true
                  tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_RELEASE_TAG}")"
                  resolve_tag_commit() {
                      local ref_json=$1
                      local object_type object_sha tag_object peel_count=0
                      object_type="$(jq -er '.object.type' <<< "$ref_json")"
                      object_sha="$(jq -er '.object.sha' <<< "$ref_json")"
                      while [[ "$object_type" == tag ]]; do
                          ((peel_count += 1))
                          test "$peel_count" -le 8
                          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
                          if [[ "$peel_count" -eq 1 ]]; then
                              test "$(jq -er '.tag' <<< "$tag_object")" = "$RAN_RELEASE_TAG"
                          fi
                          object_type="$(jq -er '.object.type' <<< "$tag_object")"
                          object_sha="$(jq -er '.object.sha' <<< "$tag_object")"
                      done
                      test "$object_type" = commit
                      printf '%s\n' "$object_sha"
                  }
                  test "$(resolve_tag_commit "$tag_ref")" = "$RAN_HISTORICAL_COMMIT"
                  echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

            - name: Synchronize exact qualified assets into the verified draft
              if: steps.identity.outputs.state == 'tagged' || steps.identity.outputs.state == 'draft'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ steps.create.outputs.release-id || steps.identity.outputs.release-id }}
              shell: bash
              run: |
                  set -euo pipefail
                  test -n "$RELEASE_ID"
                  for asset in \
                      "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip" \
                      "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip.sha256" \
                      "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json"
                  do
                      asset_name="$(basename "$asset")"
                      local_digest="sha256:$(sha256sum "$asset" | awk '{print $1}')"
                      release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
                      matches="$(jq -c --arg name "$asset_name" '[.assets[] | select(.name == $name)]' <<< "$release_json")"
                      match_count="$(jq 'length' <<< "$matches")"
                      if [[ "$match_count" -gt 1 ]]; then
                          echo "::error::Duplicate draft asset name: ${asset_name}"
                          exit 1
                      fi
                      if [[ "$match_count" -eq 1 ]]; then
                          remote_digest="$(jq -r '.[0].digest // ""' <<< "$matches")"
                          if [[ "$remote_digest" == "$local_digest" ]]; then
                              continue
                          fi
                          existing_asset_id="$(jq -er '.[0].id' <<< "$matches")"
                          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${existing_asset_id}" >/dev/null
                      fi

                      case "$asset_name" in
                          *.zip) content_type='application/zip' ;;
                          *.json) content_type='application/json' ;;
                          *.sha256) content_type='text/plain' ;;
                          *) content_type='application/octet-stream' ;;
                      esac
                      curl --fail-with-body --silent --show-error \
                          -X POST \
                          -H "Authorization: Bearer ${GH_TOKEN}" \
                          -H 'X-GitHub-Api-Version: 2026-03-10' \
                          -H "Content-Type: ${content_type}" \
                          --data-binary "@${asset}" \
                          "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${asset_name}" \
                          >/dev/null
                  done

            - name: Verify the complete exact draft before publication
              if: steps.identity.outputs.state == 'tagged' || steps.identity.outputs.state == 'draft'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ steps.create.outputs.release-id || steps.identity.outputs.release-id }}
              shell: bash
              run: |
                  set -euo pipefail
                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
                  jq -e \
                      --arg tag "$RAN_RELEASE_TAG" \
                      --arg commit "$RAN_HISTORICAL_COMMIT" \
                      '.tag_name == $tag and .target_commitish == $commit and .draft == true and .prerelease == false' \
                      <<< "$release_json" >/dev/null
                  expected_names="$(
                      printf '%s\n' \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json" \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip" \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip.sha256" \
                          | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
                  )"
                  test "$(jq -c '[.assets[].name] | sort' <<< "$release_json")" = "$expected_names"
                  local_digests="$(
                      for asset in \
                          "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json" \
                          "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip" \
                          "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip.sha256"
                      do
                          jq -nc --arg name "$(basename "$asset")" --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" '{name: $name, digest: $digest}'
                      done | jq -sc 'sort_by(.name)'
                  )"
                  remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
                  test "$remote_digests" = "$local_digests"

            - name: Publish exact reconciled release
              if: steps.identity.outputs.state == 'tagged' || steps.identity.outputs.state == 'draft'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_ID: ${{ steps.create.outputs.release-id || steps.identity.outputs.release-id }}
              shell: bash
              run: |
                  set -euo pipefail
                  jq -nc '{draft: false, prerelease: false, make_latest: "true"}' \
                      | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - >/dev/null

            - name: Read back exact tag, release, assets, and digests
              if: steps.identity.outputs.state != 'awaiting-tag'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  expected_names="$(
                      printf '%s\n' \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json" \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip" \
                          "ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip.sha256" \
                          | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
                  )"
                  local_digests="$(
                      for asset in \
                          "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.manifest.json" \
                          "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip" \
                          "dist/ran-ecwid-shop-teaser-${RAN_RELEASE_VERSION}.zip.sha256"
                      do
                          jq -nc --arg name "$(basename "$asset")" --arg digest "sha256:$(sha256sum "$asset" | awk '{print $1}')" '{name: $name, digest: $digest}'
                      done | jq -sc 'sort_by(.name)'
                  )"

                  resolve_tag_commit() {
                      local ref_json=$1
                      local object_type object_sha tag_object peel_count=0
                      object_type="$(jq -er '.object.type' <<< "$ref_json")"
                      object_sha="$(jq -er '.object.sha' <<< "$ref_json")"
                      while [[ "$object_type" == tag ]]; do
                          ((peel_count += 1))
                          test "$peel_count" -le 8
                          tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
                          if [[ "$peel_count" -eq 1 ]]; then
                              test "$(jq -er '.tag' <<< "$tag_object")" = "$RAN_RELEASE_TAG"
                          fi
                          object_type="$(jq -er '.object.type' <<< "$tag_object")"
                          object_sha="$(jq -er '.object.sha' <<< "$tag_object")"
                      done
                      test "$object_type" = commit
                      printf '%s\n' "$object_sha"
                  }

                  verified=false
                  for attempt in 1 2 3; do
                      if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_RELEASE_TAG}")" \
                          && tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_RELEASE_TAG}")"; then
                          if jq -e \
                              --arg tag "$RAN_RELEASE_TAG" \
                              --arg commit "$RAN_HISTORICAL_COMMIT" \
                              '.tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false' \
                              <<< "$release_json" >/dev/null \
                              && test "$(resolve_tag_commit "$tag_ref")" = "$RAN_HISTORICAL_COMMIT"; then
                              actual_names="$(jq -c '[.assets[].name] | sort' <<< "$release_json")"
                              remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
                              if [[ "$actual_names" == "$expected_names" && "$remote_digests" == "$local_digests" ]]; then
                                  verified=true
                                  break
                              fi
                          fi
                      fi
                      [[ "$attempt" -lt 3 ]] && sleep 2
                  done
                  if [[ "$verified" != true ]]; then
                      echo '::error::Published v1.2.3 readback did not converge to the qualified provenance.'
                      exit 1
                  fi

            - name: Reconcile Release Please PR labels only after exact publication readback
              if: steps.identity.outputs.state != 'awaiting-tag'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              shell: bash
              run: |
                  set -euo pipefail
                  labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}" --jq '[.labels[].name]')"
                  if ! jq -e 'index("autorelease: tagged") != null' <<< "$labels" >/dev/null; then
                      jq -nc '{labels: ["autorelease: tagged"]}' \
                          | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}/labels" --input - >/dev/null
                  fi
                  if jq -e 'index("autorelease: pending") != null' <<< "$labels" >/dev/null; then
                      gh api --method DELETE "repos/${GITHUB_REPOSITORY}/issues/${RAN_RELEASE_PR}/labels/autorelease%3A%20pending" >/dev/null
                  fi
