name: Quality
on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    baseline:
        uses: RocketsAreNostalgic/.github/.github/workflows/quality-wordpress-plugin.yml@72a90b5826db37d1e94cdcdcf3374ccf58c0aa7d # accepted quality-v1 provider
        with:
            php-version: '8.5'
            pnpm-version: '11.5.2'

    quality:
        name: Quality and release artifact
        runs-on: ubuntu-24.04
        outputs:
            artifact-name: ${{ steps.artifact.outputs.name }}
            archive-sha256: ${{ steps.release.outputs.archive-sha256 }}
            source-commit: ${{ steps.release.outputs.source-commit }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - name: Check out exact tested revision
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify exact tested revision
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  coverage: none
                  extensions: zip
                  tools: composer:v2, wp-cli

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.5.2

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Run deterministic source and generated-file gates
              run: |
                  pnpm install --frozen-lockfile
                  composer install --no-interaction --prefer-dist --no-progress
                  pnpm check
                  pnpm check:generated
                  composer check
                  jq -e '.draft == true and .["force-tag-creation"] == true and .["skip-github-release"] != true' release-please-config.json >/dev/null
                  grep -Fq 'release-profile-b.yml@e2fb19244a301a62f8fae2a80536898adf21fe22' .github/workflows/release-please.yml

            - name: Build exact release evidence
              id: release
              shell: bash
              env:
                  RAN_EXPECTED_COMMIT: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  source_commit="$(git rev-parse HEAD)"
                  source_tree="$(git rev-parse 'HEAD^{tree}')"
                  test "$source_commit" = "$RAN_EXPECTED_COMMIT"

                  version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' ran-ecwid-shop-teaser.php)"
                  test -n "$version"
                  grep -Fq "define( 'RAN_ECWID_SHOP_TEASER_VERSION', '${version}' );" ran-ecwid-shop-teaser.php
                  grep -Fxq "Stable tag: ${version}" readme.txt
                  test "$(jq -er '.version' package.json)" = "$version"
                  test "$(jq -er '."."' .release-please-manifest.json)" = "$version"
                  grep -Fxq "\"Project-Id-Version: RAN Ecwid Shop Teaser ${version}\\n\"" languages/ran-ecwid-shop-teaser.pot
                  bash scripts/create-release-assets.sh "v${version}"

                  archive="dist/ran-ecwid-shop-teaser-${version}.zip"
                  python3 tests/phpstan-archive-coverage.py "$archive"
                  checksum="${archive}.sha256"
                  manifest="dist/ran-ecwid-shop-teaser-${version}.manifest.json"
                  archive_sha256="$(cut -d ' ' -f 1 "$checksum")"
                  workflow_blob="$(git hash-object .github/workflows/quality.yml)"

                  jq -n \
                      --arg event "$GITHUB_EVENT_NAME" \
                      --arg sha256 "$archive_sha256" \
                      --arg sourceCommit "$source_commit" \
                      --arg sourceTree "$source_tree" \
                      --arg version "$version" \
                      --arg workflowBlob "$workflow_blob" \
                      --arg workflowRef "$GITHUB_WORKFLOW_REF" \
                      --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
                      --argjson attempt "$GITHUB_RUN_ATTEMPT" \
                      --argjson id "$GITHUB_RUN_ID" \
                      '{
                          schema: "ran-ecwid-shop-teaser-ci-release",
                          schemaVersion: 3,
                          sourceCommit: $sourceCommit,
                          sourceTree: $sourceTree,
                          version: $version,
                          sha256: $sha256,
                          run: {
                              id: $id,
                              attempt: $attempt,
                              event: $event,
                              workflowRef: $workflowRef,
                              workflowSha: $workflowSha,
                              workflowBlob: $workflowBlob
                          }
                      }' > dist/ran-ecwid-shop-teaser-ci-release.json

                  archive_name="$(basename "$archive")"
                  checksum_name="$(basename "$checksum")"
                  checksum_sha256="$(sha256sum "$checksum" | awk '{ print $1 }')"
                  jq -n \
                      --arg repository "$GITHUB_REPOSITORY" \
                      --arg commit "$source_commit" \
                      --arg tag "v${version}" \
                      --arg archive_name "$archive_name" \
                      --arg archive_sha256 "$archive_sha256" \
                      --arg checksum_name "$checksum_name" \
                      --arg checksum_sha256 "$checksum_sha256" \
                      '{schema:"ran-profile-b-promotion",schema_version:1,repository:$repository,quality_commit:$commit,source_commit:$commit,tag:$tag,assets:[{name:$archive_name,sha256:$archive_sha256},{name:$checksum_name,sha256:$checksum_sha256}]}' \
                      > dist/ran-profile-b-promotion.json

                  jq -e \
                      --arg commit "$source_commit" \
                      --arg sha256 "$archive_sha256" \
                      --arg tag "v${version}" \
                      --arg version "$version" \
                      '.schemaVersion == 1
                        and .commit == $commit
                        and .sha256 == $sha256
                        and .tag == $tag
                        and .version == $version' \
                      "$manifest" >/dev/null
                  (cd dist && sha256sum --check --strict "$(basename "$checksum")")
                  unzip -tqq "$archive"

                  {
                      printf 'archive-sha256=%s\n' "$archive_sha256"
                      printf 'source-commit=%s\n' "$source_commit"
                      printf 'version=%s\n' "$version"
                  } >> "$GITHUB_OUTPUT"

            - name: Name exact release evidence artifact
              id: artifact
              run: printf 'name=ran-ecwid-shop-teaser-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

            - name: Upload exact release evidence
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.artifact.outputs.name }}
                  path: |
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.zip
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.zip.sha256
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.manifest.json
                      dist/ran-ecwid-shop-teaser-ci-release.json
                      dist/ran-profile-b-promotion.json
                  if-no-files-found: error
                  retention-days: 7

    compatibility:
        name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
        needs: quality
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: '8.0'
                      wordpress: '6.5'
                      plugin_check: false
                    - php: '8.5'
                      wordpress: '7.1.3'
                      plugin_check: true
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: wordpress_test
                    MYSQL_ROOT_PASSWORD: root
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                ports:
                    - 3306:3306
        steps:
            - name: Check out tested source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ needs.quality.outputs.source-commit }}

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: mysqli, zip
                  tools: composer:v2, wp-cli

            - name: Install PHP test dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Record and verify compatibility runtime
              run: |
                  php --version
                  composer --version
                  wp --info
                  test "$(php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;')" = '${{ matrix.php }}'
                  printf 'Expected WordPress: %s\n' '${{ matrix.wordpress }}'

            - name: Download exact release evidence
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.quality.outputs.artifact-name }}
                  path: dist

            - name: Verify exact release evidence
              shell: bash
              run: |
                  set -euo pipefail
                  metadata='dist/ran-ecwid-shop-teaser-ci-release.json'
                  archive="dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.zip"
                  manifest="dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.manifest.json"
                  jq -e \
                      --arg commit '${{ needs.quality.outputs.source-commit }}' \
                      --arg sha256 '${{ needs.quality.outputs.archive-sha256 }}' \
                      --arg version '${{ needs.quality.outputs.version }}' \
                      --argjson run_id "$GITHUB_RUN_ID" \
                      '.schema == "ran-ecwid-shop-teaser-ci-release" and .schemaVersion == 3
                        and .sourceCommit == $commit and .version == $version and .sha256 == $sha256
                        and .run.id == $run_id
                        and (.run.attempt | type) == "number"
                        and .run.attempt >= 1' \
                      "$metadata" >/dev/null
                  jq -e --arg commit '${{ needs.quality.outputs.source-commit }}' --arg version '${{ needs.quality.outputs.version }}' \
                      '.commit == $commit and .version == $version' "$manifest" >/dev/null
                  (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
                  unzip -tqq "$archive"

            - name: Install WordPress integration-test environment
              run: |
                  curl --fail --location --silent --show-error --output /tmp/install-wp-tests.sh \
                      https://raw.githubusercontent.com/wp-cli/scaffold-command/4a464898bf96f9d5e19e9f04957a702bf9bdc191/templates/install-wp-tests.sh
                  bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }} true

            - name: Run WordPress integration tests
              run: composer test:integration

            - name: Install and activate tested ZIP in fresh WordPress
              run: |
                  archive_path="${GITHUB_WORKSPACE}/dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.zip"
                  fresh_root=/tmp/ran-ecwid-shop-teaser-release
                  wp_version='${{ matrix.wordpress }}'
                  wp core download --path="$fresh_root" --version="$wp_version"
                  test "$(wp core version --path="$fresh_root")" = "$wp_version"
                  wp config create --path="$fresh_root" --dbname=ran_ecwid_shop_teaser_release --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
                  wp db create --path="$fresh_root"
                  wp core install --path="$fresh_root" --url=http://localhost --title='RAN release test' --admin_user=admin --admin_password=release-test-password --admin_email=admin@example.test
                  wp plugin install "$archive_path" --path="$fresh_root" --activate
                  wp plugin is-active ran-ecwid-shop-teaser --path="$fresh_root"
                  test "$(wp plugin get ran-ecwid-shop-teaser --field=version --path="$fresh_root")" = '${{ needs.quality.outputs.version }}'
                  if [[ '${{ matrix.plugin_check }}' == true ]]; then
                      wp plugin install plugin-check --path="$fresh_root" --activate
                      wp eval '
                          $readme = file_get_contents( WP_PLUGIN_DIR . "/ran-ecwid-shop-teaser/readme.txt" );
                          $parsed = new WordPress\Plugin_Check\Lib\Readme\Parser( $readme );
                          if ( RAN_ECWID_SHOP_TEASER_VERSION !== $parsed->stable_tag || "GPLv2 or later" !== $parsed->license ) {
                              throw new RuntimeException( "Installed readme headers were not parsed." );
                          }
                          $broken = str_replace( array( "<!-- x-release-please-start-version: -->", "<!-- x-release-please-end: -->" ), array( "x-release-please-start-version", "x-release-please-end" ), $readme );
                          $negative = new WordPress\Plugin_Check\Lib\Readme\Parser( $broken );
                          if ( "" !== $negative->stable_tag || "" !== $negative->license ) {
                              throw new RuntimeException( "The bare-marker negative control did not reproduce header loss." );
                          }
                          WP_CLI::success( "Real installed readme parser accepts annotations and rejects the bare-marker control." );
                      ' --path="$fresh_root"
                      report="$RUNNER_TEMP/ran-ecwid-plugin-check.json"
                      if wp plugin check ran-ecwid-shop-teaser --path="$fresh_root" \
                          --quiet --format=strict-json --fields=file,line,column,type,code,message,docs > "$report"; then
                          if [[ ! -s "$report" ]]; then printf '[]\n' > "$report"; fi
                      else
                          cat "$report"
                          exit 1
                      fi
                      python3 tools/verify-plugin-check.py "$report"
                  fi

    quality-gate:
        name: quality
        if: ${{ always() }}
        needs:
            - baseline
            - quality
            - compatibility
        runs-on: ubuntu-latest
        steps:
            - name: Require all ordinary quality lanes
              env:
                  BASELINE_RESULT: ${{ needs.baseline.result }}
                  SOURCE_RESULT: ${{ needs.quality.result }}
                  COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
              run: |
                  printf 'baseline=%s\nsource=%s\ncompatibility=%s\n' \
                    "$BASELINE_RESULT" "$SOURCE_RESULT" "$COMPATIBILITY_RESULT"
                  if [ "$BASELINE_RESULT" != success ] \
                    || [ "$SOURCE_RESULT" != success ] \
                    || [ "$COMPATIBILITY_RESULT" != success ]; then
                      exit 1
                  fi
