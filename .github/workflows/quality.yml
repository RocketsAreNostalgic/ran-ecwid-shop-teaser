name: Quality

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    quality:
        name: Quality and release artifact
        runs-on: blacksmith-2vcpu-ubuntu-2404
        outputs:
            artifact-name: ${{ steps.release.outputs.artifact-name }}
            matrix: ${{ steps.release.outputs.matrix }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none
                  extensions: zip
                  tools: composer:v2, wp-cli

            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.5.2

            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Install development dependencies
              run: |
                  pnpm install --frozen-lockfile
                  composer install --no-interaction --prefer-dist --no-progress

            - name: Run cheap source and generated-file gates
              run: |
                  pnpm check
                  pnpm check:generated
                  php tools/lint-php.php
                  composer lint
                  composer lint:compat
                  grep -Fq "github.event_name == 'pull_request'" .github/workflows/quality.yml
                  # These single-quoted patterns are literal workflow contracts.
                  # shellcheck disable=SC2016
                  grep -Fq 'git log -1 --format=%H "$RAN_QUALITY_COMMIT" -- .release-please-manifest.json' .github/workflows/release-please.yml
                  # shellcheck disable=SC2016
                  grep -Fq 'git rev-parse "${RAN_QUALITY_COMMIT}^{tree}"' .github/workflows/release-please.yml

            - name: Build and verify the canonical release assets once
              id: release
              shell: bash
              env:
                  RAN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  RAN_PR_BASE: ${{ github.event.pull_request.base.ref }}
                  RAN_PR_HEAD: ${{ github.event.pull_request.head.ref }}
                  RAN_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
              run: |
                  set -euo pipefail
                  version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' ran-ecwid-shop-teaser.php)"
                  test -n "$version"
                  bash scripts/create-release-assets.sh "v${version}"

                  release_candidate=false
                  if [[ "$GITHUB_EVENT_NAME" == pull_request \
                      && "$RAN_PR_AUTHOR" == 'github-actions[bot]' \
                      && "$RAN_PR_BASE" == main \
                      && "$RAN_PR_HEAD" == 'release-please--branches--main--components--ran-ecwid-shop-teaser' \
                      && "$RAN_PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                      release_candidate=true
                  fi

                  if [[ "$release_candidate" == true ]]; then
                      matrix='{"include":[{"php":"8.3","wordpress":"latest","plugin_check":true}]}'
                  else
                      matrix='{"include":[{"php":"8.0","wordpress":"6.5","plugin_check":false},{"php":"8.3","wordpress":"latest","plugin_check":true}]}'
                  fi

                  {
                      printf 'artifact-name=ran-ecwid-shop-teaser-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
                      printf 'matrix=%s\n' "$matrix"
                      printf 'version=%s\n' "$version"
                  } >> "$GITHUB_OUTPUT"

            - name: Upload the verified release assets
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.release.outputs.artifact-name }}
                  path: |
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.zip
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.zip.sha256
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.manifest.json
                  if-no-files-found: error
                  retention-days: 7

    compatibility:
        name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
        needs: quality
        runs-on: blacksmith-2vcpu-ubuntu-2404
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.quality.outputs.matrix) }}
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: wordpress_test
                    MYSQL_ROOT_PASSWORD: root
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                ports:
                    - 3306:3306
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: mysqli, zip
                  tools: composer:v2, wp-cli

            - name: Install PHP test dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Download the canonical release assets
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.quality.outputs.artifact-name }}
                  path: dist

            - name: Verify the shared archive identity
              shell: bash
              run: |
                  set -euo pipefail
                  archive="dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.zip"
                  manifest="dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.manifest.json"
                  test "$(jq -er '.commit' "$manifest")" = "$GITHUB_SHA"
                  test "$(jq -er '.version' "$manifest")" = '${{ needs.quality.outputs.version }}'
                  (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
                  unzip -tqq "$archive"

            - name: Install WordPress integration-test environment
              run: |
                  curl --fail --location --silent --show-error \
                      --output /tmp/install-wp-tests.sh \
                      https://raw.githubusercontent.com/wp-cli/scaffold-command/main/templates/install-wp-tests.sh
                  bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }} true

            - name: Run WordPress integration tests
              run: composer test

            - name: Install and activate the shared release ZIP in fresh WordPress
              run: |
                  archive_path="${GITHUB_WORKSPACE}/dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.zip"
                  fresh_root=/tmp/ran-ecwid-shop-teaser-release
                  wp_version='${{ matrix.wordpress }}'
                  if [[ "$wp_version" == latest ]]; then
                      wp core download --path="$fresh_root"
                  else
                      wp core download --path="$fresh_root" --version="$wp_version"
                  fi
                  wp config create --path="$fresh_root" --dbname=ran_ecwid_shop_teaser_release --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
                  wp db create --path="$fresh_root"
                  wp core install --path="$fresh_root" --url=http://localhost --title='RAN release test' --admin_user=admin --admin_password=release-test-password --admin_email=admin@example.test
                  wp plugin install "$archive_path" --path="$fresh_root" --activate
                  wp plugin is-active ran-ecwid-shop-teaser --path="$fresh_root"
                  if [[ '${{ matrix.plugin_check }}' == true ]]; then
                      wp plugin install plugin-check --path="$fresh_root" --activate
                      wp plugin check ran-ecwid-shop-teaser --path="$fresh_root"
                  fi
