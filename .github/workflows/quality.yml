name: Quality

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    quality:
        name: Quality and release artifact
        runs-on: blacksmith-2vcpu-ubuntu-2404
        outputs:
            artifact-name: ${{ steps.artifact.outputs.name }}
            archive-sha256: ${{ steps.release.outputs.archive-sha256 }}
            lane: ${{ steps.release.outputs.lane }}
            matrix: ${{ steps.release.outputs.matrix }}
            source-commit: ${{ steps.release.outputs.source-commit }}
            version: ${{ steps.release.outputs.version }}
        steps:
            - name: Check out tested pull-request merge
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Classify exact Release Please candidate
              id: lifecycle
              shell: bash
              env:
                  RAN_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
                  RAN_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
                  RAN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  RAN_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  RAN_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  RAN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  set -euo pipefail
                  lane=full
                  source_commit="$(git rev-parse HEAD)"

                  if [[ "$GITHUB_EVENT_NAME" == pull_request \
                      && "$GITHUB_ACTOR" == 'github-actions[bot]' \
                      && "$RAN_PR_AUTHOR" == 'github-actions[bot]' \
                      && "$RAN_PR_BASE_REF" == main \
                      && "$RAN_PR_HEAD_REF" == 'release-please--branches--main--components--ran-ecwid-shop-teaser' \
                      && "$RAN_PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]]; then
                      bash scripts/validate-release-candidate.sh "$RAN_PR_BASE_SHA" "$RAN_PR_HEAD_SHA"
                      git checkout --detach "$RAN_PR_HEAD_SHA"
                      lane=release-candidate
                      source_commit="$RAN_PR_HEAD_SHA"
                  fi

                  {
                      printf 'lane=%s\n' "$lane"
                      printf 'source-commit=%s\n' "$source_commit"
                  } >> "$GITHUB_OUTPUT"

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none
                  extensions: zip
                  tools: composer:v2, wp-cli

            - name: Set up pnpm for full PR validation
              if: ${{ steps.lifecycle.outputs.lane == 'full' }}
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.5.2

            - name: Set up Node.js for full PR validation
              if: ${{ steps.lifecycle.outputs.lane == 'full' }}
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json
                  cache: pnpm

            - name: Run full source and generated-file gates once
              if: ${{ steps.lifecycle.outputs.lane == 'full' }}
              run: |
                  pnpm install --frozen-lockfile
                  composer install --no-interaction --prefer-dist --no-progress
                  pnpm check
                  pnpm check:generated
                  composer lint
                  composer lint:compat

            - name: Run strict release-candidate contract gates
              if: ${{ steps.lifecycle.outputs.lane == 'release-candidate' }}
              run: |
                  bash tests/release-candidate-contract.sh
                  bash tests/release-workflow-contract.sh
                  php tools/lint-php.php

            - name: Build exact PR-head release evidence
              id: release
              shell: bash
              env:
                  RAN_LANE: ${{ steps.lifecycle.outputs.lane }}
                  RAN_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
                  RAN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  RAN_PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
                  RAN_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  RAN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                  RAN_PR_NUMBER: ${{ github.event.pull_request.number }}
              run: |
                  set -euo pipefail
                  source_commit="$(git rev-parse HEAD)"
                  source_tree="$(git rev-parse 'HEAD^{tree}')"
                  tested_commit="$source_commit"
                  tested_tree="$source_tree"
                  version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\([^[:space:]]*\).*$/\1/p' ran-ecwid-shop-teaser.php)"
                  test -n "$version"
                  bash scripts/create-release-assets.sh "v${version}"
                  archive="dist/ran-ecwid-shop-teaser-${version}.zip"
                  archive_sha256="$(cut -d ' ' -f 1 "${archive}.sha256")"
                  workflow_blob="$(git hash-object .github/workflows/quality.yml)"
                  pr_number="${RAN_PR_NUMBER:-0}"

                  jq -n \
                      --arg baseRef "${RAN_PR_BASE_REF:-}" \
                      --arg baseSha "${RAN_PR_BASE_SHA:-}" \
                      --arg event "$GITHUB_EVENT_NAME" \
                      --arg headRef "${RAN_PR_HEAD_REF:-}" \
                      --arg headRepository "${RAN_PR_HEAD_REPOSITORY:-}" \
                      --arg headSha "${RAN_PR_HEAD_SHA:-}" \
                      --arg lane "$RAN_LANE" \
                      --arg qualityCommit "$GITHUB_SHA" \
                      --arg sha256 "$archive_sha256" \
                      --arg sourceCommit "$source_commit" \
                      --arg sourceTree "$source_tree" \
                      --arg testedCommit "$tested_commit" \
                      --arg testedTree "$tested_tree" \
                      --arg version "$version" \
                      --arg workflowBlob "$workflow_blob" \
                      --arg workflowRef "$GITHUB_WORKFLOW_REF" \
                      --arg workflowSha "$GITHUB_WORKFLOW_SHA" \
                      --argjson attempt "$GITHUB_RUN_ATTEMPT" \
                      --argjson id "$GITHUB_RUN_ID" \
                      --argjson number "$pr_number" \
                      '{
                          schema: "ran-ecwid-shop-teaser-ci-release",
                          schemaVersion: 2,
                          lane: $lane,
                          qualityCommit: $qualityCommit,
                          sourceCommit: $sourceCommit,
                          sourceTree: $sourceTree,
                          testedCommit: $testedCommit,
                          testedTree: $testedTree,
                          version: $version,
                          sha256: $sha256,
                          run: {
                              id: $id,
                              attempt: $attempt,
                              event: $event,
                              workflowRef: $workflowRef,
                              workflowSha: $workflowSha,
                              workflowBlob: $workflowBlob
                          },
                          pullRequest: {
                              number: $number,
                              baseRef: $baseRef,
                              baseSha: $baseSha,
                              headRef: $headRef,
                              headRepository: $headRepository,
                              headSha: $headSha
                          }
                      }' > dist/ran-ecwid-shop-teaser-ci-release.json

                  if [[ "$RAN_LANE" == release-candidate ]]; then
                      matrix='{"include":[{"php":"8.3","wordpress":"latest","plugin_check":true,"integration_tests":false}]}'
                  else
                      matrix='{"include":[{"php":"8.0","wordpress":"6.5","plugin_check":false,"integration_tests":true},{"php":"8.3","wordpress":"latest","plugin_check":true,"integration_tests":true}]}'
                  fi
                  {
                      printf 'archive-sha256=%s\n' "$archive_sha256"
                      printf 'lane=%s\n' "$RAN_LANE"
                      printf 'matrix=%s\n' "$matrix"
                      printf 'source-commit=%s\n' "$source_commit"
                      printf 'version=%s\n' "$version"
                  } >> "$GITHUB_OUTPUT"

            - name: Name PR evidence artifact
              id: artifact
              run: printf 'name=ran-ecwid-shop-teaser-ci-release-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

            - name: Upload verified PR evidence
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ${{ steps.artifact.outputs.name }}
                  path: |
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.zip
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.zip.sha256
                      dist/ran-ecwid-shop-teaser-${{ steps.release.outputs.version }}.manifest.json
                      dist/ran-ecwid-shop-teaser-ci-release.json
                  if-no-files-found: error
                  retention-days: 30

    compatibility:
        name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
        needs: quality
        runs-on: blacksmith-2vcpu-ubuntu-2404
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.quality.outputs.matrix) }}
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_DATABASE: wordpress_test
                    MYSQL_ROOT_PASSWORD: root
                options: >-
                    --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                ports:
                    - 3306:3306
        steps:
            - name: Check out tested source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
                  ref: ${{ needs.quality.outputs.source-commit }}

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  extensions: mysqli, zip
                  tools: composer:v2, wp-cli

            - name: Install PHP test dependencies
              if: ${{ matrix.integration_tests }}
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Download exact PR evidence
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ needs.quality.outputs.artifact-name }}
                  path: dist

            - name: Verify shared archive identity
              shell: bash
              run: |
                  set -euo pipefail
                  metadata='dist/ran-ecwid-shop-teaser-ci-release.json'
                  archive="dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.zip"
                  manifest="dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.manifest.json"
                  jq -e \
                      --arg commit '${{ needs.quality.outputs.source-commit }}' \
                      --arg sha256 '${{ needs.quality.outputs.archive-sha256 }}' \
                      --arg version '${{ needs.quality.outputs.version }}' \
                      --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
                      --argjson run_id "$GITHUB_RUN_ID" \
                      '.schema == "ran-ecwid-shop-teaser-ci-release" and .schemaVersion == 2
                        and .sourceCommit == $commit and .version == $version and .sha256 == $sha256
                        and .run.id == $run_id and .run.attempt == $run_attempt' \
                      "$metadata" >/dev/null
                  jq -e --arg commit '${{ needs.quality.outputs.source-commit }}' --arg version '${{ needs.quality.outputs.version }}' \
                      '.commit == $commit and .version == $version' "$manifest" >/dev/null
                  (cd dist && sha256sum --check --strict "$(basename "$archive").sha256")
                  unzip -tqq "$archive"

            - name: Install WordPress integration-test environment
              if: ${{ matrix.integration_tests }}
              run: |
                  curl --fail --location --silent --show-error --output /tmp/install-wp-tests.sh \
                      https://raw.githubusercontent.com/wp-cli/scaffold-command/main/templates/install-wp-tests.sh
                  bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wordpress }} true

            - name: Run WordPress integration tests
              if: ${{ matrix.integration_tests }}
              run: composer test

            - name: Install and activate tested ZIP in fresh WordPress
              run: |
                  archive_path="${GITHUB_WORKSPACE}/dist/ran-ecwid-shop-teaser-${{ needs.quality.outputs.version }}.zip"
                  fresh_root=/tmp/ran-ecwid-shop-teaser-release
                  wp_version='${{ matrix.wordpress }}'
                  if [[ "$wp_version" == latest ]]; then wp core download --path="$fresh_root"; else wp core download --path="$fresh_root" --version="$wp_version"; fi
                  wp config create --path="$fresh_root" --dbname=ran_ecwid_shop_teaser_release --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
                  wp db create --path="$fresh_root"
                  wp core install --path="$fresh_root" --url=http://localhost --title='RAN release test' --admin_user=admin --admin_password=release-test-password --admin_email=admin@example.test
                  wp plugin install "$archive_path" --path="$fresh_root" --activate
                  wp plugin is-active ran-ecwid-shop-teaser --path="$fresh_root"
                  test "$(wp plugin get ran-ecwid-shop-teaser --field=version --path="$fresh_root")" = '${{ needs.quality.outputs.version }}'
                  if [[ '${{ matrix.plugin_check }}' == true ]]; then
                      wp plugin install plugin-check --path="$fresh_root" --activate
                      wp plugin check ran-ecwid-shop-teaser --path="$fresh_root"
                  fi
