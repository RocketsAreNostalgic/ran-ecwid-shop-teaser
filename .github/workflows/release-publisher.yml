name: Release Please

on:
    workflow_run:
        workflows: [Quality]
        types: [completed]
        branches: [main]

permissions: {}

concurrency:
    group: release-please-main
    cancel-in-progress: false

jobs:
    release-please:
        if: >-
            ${{
                github.event.workflow_run.event == 'push'
                && github.event.workflow_run.conclusion == 'success'
                && github.event.workflow_run.head_branch == 'main'
                && github.event.workflow_run.head_repository.id == github.repository_id
                && github.event.workflow_run.head_repository.full_name == github.repository
            }}
        runs-on: blacksmith-2vcpu-ubuntu-2404
        permissions:
            actions: write
            contents: write
            issues: write
            pull-requests: write
        steps:
            - name: Resolve exact successful Quality evidence
              id: quality
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ github.event.workflow_run.head_sha }}
                  RAN_QUALITY_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
                  RAN_QUALITY_RUN_ID: ${{ github.event.workflow_run.id }}
              run: |
                  set -euo pipefail
                  [[ "$RAN_QUALITY_COMMIT" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$RAN_QUALITY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
                  [[ "$RAN_QUALITY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

                  workflow="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml")"
                  workflow_id="$(jq -er '.id' <<< "$workflow")"
                  evidence="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RAN_QUALITY_RUN_ID}")"
                  jq -e \
                      --arg commit "$RAN_QUALITY_COMMIT" \
                      --arg repository "$GITHUB_REPOSITORY" \
                      --argjson run_attempt "$RAN_QUALITY_RUN_ATTEMPT" \
                      --argjson run_id "$RAN_QUALITY_RUN_ID" \
                      --argjson workflow_id "$workflow_id" \
                      '.id == $run_id
                        and .run_attempt == $run_attempt
                        and .workflow_id == $workflow_id
                        and .name == "Quality"
                        and .path == ".github/workflows/quality.yml"
                        and .event == "push"
                        and .status == "completed"
                        and .conclusion == "success"
                        and .head_branch == "main"
                        and .head_repository.full_name == $repository
                        and .repository.full_name == $repository
                        and .head_sha == $commit
                        and .head_commit.id == $commit' \
                      <<< "$evidence" >/dev/null

                  {
                      printf 'artifact-name=ran-ecwid-shop-teaser-ci-release-%s-%s\n' "$RAN_QUALITY_RUN_ID" "$RAN_QUALITY_RUN_ATTEMPT"
                      printf 'commit=%s\n' "$RAN_QUALITY_COMMIT"
                      printf 'run-attempt=%s\n' "$RAN_QUALITY_RUN_ATTEMPT"
                      printf 'run-id=%s\n' "$RAN_QUALITY_RUN_ID"
                  } >> "$GITHUB_OUTPUT"

            - name: Check out exact qualified commit
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ steps.quality.outputs.commit }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Verify exact qualified checkout
              env:
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
              run: |
                  set -euo pipefail
                  test "$(git rev-parse HEAD)" = "$RAN_QUALITY_COMMIT"

            - name: Admit publisher for exact reviewed merge
              id: admission
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
              shell: bash
              run: |
                  set -euo pipefail
                  pr_json="$(
                      gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&per_page=100" \
                          | jq -cer \
                              --arg commit "$RAN_QUALITY_COMMIT" \
                              --arg repository "$GITHUB_REPOSITORY" \
                              'add | [.[] | select(
                                  .merged_at != null
                                  and .base.ref == "main"
                                  and .head.repo.full_name == $repository
                                  and .merge_commit_sha == $commit
                              )]
                              | if length == 1 then .[0] else error("Expected exactly one merged PR for the qualified main commit.") end'
                  )"
                  pr_number="$(jq -er '.number' <<< "$pr_json")"
                  release_pr="$(jq -r \
                      --arg bot 'github-actions[bot]' \
                      --arg head 'release-please--branches--main--components--ran-ecwid-shop-teaser' \
                      --arg repository "$GITHUB_REPOSITORY" \
                      '.user.login == $bot
                        and .base.ref == "main"
                        and .head.ref == $head
                        and .head.repo.full_name == $repository' \
                      <<< "$pr_json")"

                  files_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files?per_page=100")"
                  for path in \
                      .github/workflows/quality.yml \
                      .github/workflows/release-publisher.yml \
                      tests/release-workflow-contract.sh \
                      tests/release-publication-contract.sh \
                      scripts/validate-release-candidate.sh \
                      scripts/create-release-assets.sh \
                      tools/build-release.php \
                      wordpress-org/deployment.json \
                      release-please-config.json; do
                      if jq -e --arg path "$path" 'add | any(.filename == $path)' <<< "$files_json" >/dev/null; then
                          printf 'admitted=false\n' >> "$GITHUB_OUTPUT"
                          printf '::notice::Release Please abstained because trusted release control changed: %s\n' "$path"
                          exit 0
                      fi
                  done

                  if [[ "$release_pr" != true ]]; then
                      for path in composer.json composer.lock package.json pnpm-lock.yaml; do
                          if jq -e --arg path "$path" 'add | any(.filename == $path)' <<< "$files_json" >/dev/null; then
                              printf 'admitted=false\n' >> "$GITHUB_OUTPUT"
                              printf '::notice::Release Please abstained because the Quality dependency contract changed: %s\n' "$path"
                              exit 0
                          fi
                      done
                  fi

                  printf 'admitted=true\n' >> "$GITHUB_OUTPUT"

            - name: Revalidate exact current main
              id: current_main
              if: steps.admission.outputs.admitted == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
              shell: bash
              run: |
                  set -euo pipefail
                  live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
                  if [[ "$live_main" != "$RAN_QUALITY_COMMIT" ]]; then
                      printf 'current=false\n' >> "$GITHUB_OUTPUT"
                      printf '::notice::Release Please abstained because main advanced from %s to %s.\n' "$RAN_QUALITY_COMMIT" "$live_main"
                      exit 0
                  fi
                  printf 'current=true\n' >> "$GITHUB_OUTPUT"

            - name: Open, update, or publish the Release Please release
              id: release
              if: steps.admission.outputs.admitted == 'true' && steps.current_main.outputs.current == 'true'
              uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

            - name: Dispatch exact Release Please candidate Quality
              if: steps.admission.outputs.admitted == 'true' && steps.current_main.outputs.current == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
              shell: bash
              run: |
                  set -euo pipefail
                  expected_head='release-please--branches--main--components--ran-ecwid-shop-teaser'
                  open_prs="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls?state=open&base=main&per_page=100")"
                  candidate_prs="$(jq -cer \
                      --arg bot 'github-actions[bot]' \
                      --arg head "$expected_head" \
                      --arg repository "$GITHUB_REPOSITORY" \
                      'add | [.[] | select(
                          .state == "open"
                          and .user.login == $bot
                          and .base.ref == "main"
                          and .head.ref == $head
                          and .head.repo.full_name == $repository
                      )]' <<< "$open_prs")"
                  candidate_count="$(jq -er 'length' <<< "$candidate_prs")"
                  if [[ "$candidate_count" == 0 ]]; then
                      exit 0
                  fi
                  test "$candidate_count" == 1

                  candidate="$(jq -cer '.[0]' <<< "$candidate_prs")"
                  candidate_number="$(jq -er '.number' <<< "$candidate")"
                  base_sha="$(jq -er '.base.sha' <<< "$candidate")"
                  head_sha="$(jq -er '.head.sha' <<< "$candidate")"
                  [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
                  [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
                  test "$base_sha" = "$RAN_QUALITY_COMMIT"
                  test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${expected_head}" --jq '.object.sha')" = "$head_sha"

                  commit_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head_sha}")"
                  jq -e \
                      --arg base "$base_sha" \
                      --arg bot 'github-actions[bot]' \
                      --arg head "$head_sha" \
                      --arg committer 'web-flow' \
                      '.sha == $head
                        and .author.login == $bot
                        and .committer.login == $committer
                        and .commit.verification.verified == true
                        and .commit.verification.reason == "valid"
                        and (.parents | length) == 1
                        and .parents[0].sha == $base' \
                      <<< "$commit_json" >/dev/null

                  git fetch --no-tags origin "+refs/heads/${expected_head}:refs/remotes/origin/${expected_head}"
                  test "$(git rev-parse "refs/remotes/origin/${expected_head}")" = "$head_sha"
                  bash scripts/validate-release-candidate.sh "$base_sha" "$head_sha"

                  workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml" --jq '.id')"
                  runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?head_sha=${head_sha}&per_page=100")"
                  dispatch_title="Quality candidate PR #${candidate_number} @ ${head_sha}"
                  suppress_dispatch="$(jq -r \
                      --arg bot 'github-actions[bot]' \
                      --arg dispatch_title "$dispatch_title" \
                      --arg head "$expected_head" \
                      --arg repository "$GITHUB_REPOSITORY" \
                      --arg sha "$head_sha" \
                      --argjson workflow_id "$workflow_id" \
                      'any(.workflow_runs[];
                          .workflow_id == $workflow_id
                          and .path == ".github/workflows/quality.yml"
                          and .event == "workflow_dispatch"
                          and .display_title == $dispatch_title
                          and .head_branch == $head
                          and .head_repository.full_name == $repository
                          and .head_sha == $sha
                          and .actor.login == $bot
                          and (
                              (.status == "completed" and .conclusion == "success")
                              or .status == "requested"
                              or .status == "queued"
                              or .status == "pending"
                              or .status == "waiting"
                              or .status == "in_progress"
                          )
                      )' <<< "$runs")"
                  if [[ "$suppress_dispatch" == true ]]; then
                      exit 0
                  fi

                  jq -nc \
                      --arg ref "$expected_head" \
                      --arg release_pr "$candidate_number" \
                      '{ref: $ref, inputs: {release_pr: $release_pr}}' \
                      | gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/dispatches" --input - >/dev/null

            - name: Resolve exact release for the qualified commit
              id: release_state
              if: steps.admission.outputs.admitted == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
                  RAN_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
              shell: bash
              run: |
                  set -euo pipefail
                  version="$(jq -er '."."' .release-please-manifest.json)"
                  [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
                  tag_name="v${version}"

                  tag_file="${RUNNER_TEMP}/ran-ecwid-release-tag.json"
                  tag_status="$(
                      curl --silent --show-error \
                          --output "$tag_file" \
                          --write-out '%{http_code}' \
                          -H "Authorization: Bearer ${GH_TOKEN}" \
                          -H 'Accept: application/vnd.github+json' \
                          -H 'X-GitHub-Api-Version: 2022-11-28' \
                          "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag_name}"
                  )"
                  if [[ "$tag_status" == 404 ]]; then
                      if [[ "${RAN_RELEASE_CREATED:-false}" == true ]]; then
                          echo "::error::Release Please reported a created release but the exact tag is absent."
                          exit 1
                      fi
                      echo 'ready=false' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  test "$tag_status" = 200
                  tag_ref="$(cat "$tag_file")"

                  tag_type="$(jq -er '.object.type' <<< "$tag_ref")"
                  tag_commit="$(jq -er '.object.sha' <<< "$tag_ref")"
                  peel_count=0
                  while [[ "$tag_type" == tag ]]; do
                      ((peel_count += 1))
                      test "$peel_count" -le 8
                      tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_commit}")"
                      if [[ "$peel_count" -eq 1 ]]; then
                          test "$(jq -er '.tag' <<< "$tag_object")" = "$tag_name"
                      fi
                      tag_type="$(jq -er '.object.type' <<< "$tag_object")"
                      tag_commit="$(jq -er '.object.sha' <<< "$tag_object")"
                  done
                  test "$tag_type" = commit

                  if [[ "$tag_commit" != "$RAN_QUALITY_COMMIT" ]]; then
                      if [[ "${RAN_RELEASE_CREATED:-false}" == true ]]; then
                          echo "::error::Release Please created a tag that does not resolve to the qualified commit."
                          exit 1
                      fi
                      echo 'ready=false' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag_name}")"
                  jq -e \
                      --arg commit "$RAN_QUALITY_COMMIT" \
                      --arg tag "$tag_name" \
                      '.tag_name == $tag
                        and .target_commitish == $commit
                        and .draft == false
                        and .prerelease == false
                        and ((has("immutable") | not) or (.immutable | type == "boolean"))' \
                      <<< "$release_json" >/dev/null

                  {
                      printf 'ready=true\n'
                      printf 'tag-name=%s\n' "$tag_name"
                      printf 'version=%s\n' "$version"
                  } >> "$GITHUB_OUTPUT"

            - name: Download exact qualified release assets
              if: steps.release_state.outputs.ready == 'true'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: ${{ steps.quality.outputs.artifact-name }}
                  path: dist
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  run-id: ${{ steps.quality.outputs.run-id }}

            - name: Synchronize and read back exact release assets
              if: steps.release_state.outputs.ready == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RAN_QUALITY_COMMIT: ${{ steps.quality.outputs.commit }}
                  RAN_QUALITY_RUN_ATTEMPT: ${{ steps.quality.outputs.run-attempt }}
                  RAN_QUALITY_RUN_ID: ${{ steps.quality.outputs.run-id }}
                  RAN_TAG_NAME: ${{ steps.release_state.outputs.tag-name }}
                  RAN_VERSION: ${{ steps.release_state.outputs.version }}
              shell: bash
              run: |
                  set -euo pipefail
                  archive="ran-ecwid-shop-teaser-${RAN_VERSION}.zip"
                  checksum="${archive}.sha256"
                  manifest="ran-ecwid-shop-teaser-${RAN_VERSION}.manifest.json"
                  metadata='dist/ran-ecwid-shop-teaser-ci-release.json'
                  for name in "$archive" "$checksum" "$manifest"; do
                      test -f "dist/${name}"
                  done
                  test -f "$metadata"

                  archive_sha256="$(sha256sum "dist/${archive}" | awk '{print $1}')"
                  jq -e \
                      --arg commit "$RAN_QUALITY_COMMIT" \
                      --arg sha256 "$archive_sha256" \
                      --arg version "$RAN_VERSION" \
                      --argjson run_attempt "$RAN_QUALITY_RUN_ATTEMPT" \
                      --argjson run_id "$RAN_QUALITY_RUN_ID" \
                      '.schema == "ran-ecwid-shop-teaser-ci-release"
                        and .schemaVersion == 3
                        and .sourceCommit == $commit
                        and .version == $version
                        and .sha256 == $sha256
                        and .run.id == $run_id
                        and .run.attempt == $run_attempt
                        and .run.event == "push"' \
                      "$metadata" >/dev/null
                  jq -e \
                      --arg archive "$archive" \
                      --arg commit "$RAN_QUALITY_COMMIT" \
                      --arg sha256 "$archive_sha256" \
                      --arg tag "$RAN_TAG_NAME" \
                      --arg version "$RAN_VERSION" \
                      '.schemaVersion == 1
                        and .archive == $archive
                        and .commit == $commit
                        and .sha256 == $sha256
                        and .tag == $tag
                        and .version == $version' \
                      "dist/${manifest}" >/dev/null
                  (cd dist && sha256sum --check --strict "$checksum")
                  unzip -tqq "dist/${archive}"

                  expected_names="$(
                      printf '%s\n' "$manifest" "$archive" "$checksum" \
                          | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
                  )"
                  local_digests="$(
                      for name in "$manifest" "$archive" "$checksum"; do
                          jq -nc \
                              --arg name "$name" \
                              --arg digest "sha256:$(sha256sum "dist/${name}" | awk '{print $1}')" \
                              '{name: $name, digest: $digest}'
                      done | jq -sc 'sort_by(.name)'
                  )"

                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_TAG_NAME}")"
                  actual_names="$(jq -c '[.assets[].name] | sort' <<< "$release_json")"
                  remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
                  immutable="$(jq -r '.immutable // false' <<< "$release_json")"

                  if [[ "$actual_names" != "$expected_names" || "$remote_digests" != "$local_digests" ]]; then
                      test "$immutable" = false
                      extra_assets="$(jq -c --argjson expected "$expected_names" '[.assets[].name] - $expected' <<< "$release_json")"
                      test "$extra_assets" = '[]'
                      gh release upload "$RAN_TAG_NAME" \
                          "dist/${archive}" \
                          "dist/${checksum}" \
                          "dist/${manifest}" \
                          --clobber \
                          --repo "$GITHUB_REPOSITORY"
                  fi

                  release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RAN_TAG_NAME}")"
                  jq -e \
                      --arg commit "$RAN_QUALITY_COMMIT" \
                      --arg tag "$RAN_TAG_NAME" \
                      --argjson expected "$expected_names" \
                      '.tag_name == $tag
                        and .target_commitish == $commit
                        and .draft == false
                        and .prerelease == false
                        and ([.assets[].name] | sort) == $expected' \
                      <<< "$release_json" >/dev/null
                  remote_digests="$(jq -c '[.assets[] | {name, digest}] | sort_by(.name)' <<< "$release_json")"
                  test "$remote_digests" = "$local_digests"

                  final_tag_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RAN_TAG_NAME}")"
                  final_tag_type="$(jq -er '.object.type' <<< "$final_tag_ref")"
                  final_tag_commit="$(jq -er '.object.sha' <<< "$final_tag_ref")"
                  final_peel_count=0
                  while [[ "$final_tag_type" == tag ]]; do
                      ((final_peel_count += 1))
                      test "$final_peel_count" -le 8
                      final_tag_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${final_tag_commit}")"
                      if [[ "$final_peel_count" -eq 1 ]]; then
                          test "$(jq -er '.tag' <<< "$final_tag_object")" = "$RAN_TAG_NAME"
                      fi
                      final_tag_type="$(jq -er '.object.type' <<< "$final_tag_object")"
                      final_tag_commit="$(jq -er '.object.sha' <<< "$final_tag_object")"
                  done
                  test "$final_tag_type" = commit
                  test "$final_tag_commit" = "$RAN_QUALITY_COMMIT"
