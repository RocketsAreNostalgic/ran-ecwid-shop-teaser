name: Normalize quality sources

on:
    pull_request:

permissions:
    contents: write

jobs:
    normalize:
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.ref == 'chore/adopt-shared-quality-profile'
        runs-on: ubuntu-latest
        steps:
            - name: Check out feature branch
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up PHP and WP-CLI
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: wp-cli

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.5.2

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json

            - name: Install exact Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Normalize block sources and regenerate tracked outputs
              run: |
                  pnpm exec prettier --write 'blocks/**/*.{js,css,json}'
                  pnpm build
                  pnpm i18n:pot

            - name: Commit only formatting and corresponding generated outputs
              shell: bash
              run: |
                  set -euo pipefail
                  changed="$(git diff --name-only)"
                  printf '%s\n' "$changed"
                  while IFS= read -r path; do
                      [[ -z "$path" \
                        || "$path" == blocks/* \
                        || "$path" == build/blocks/* \
                        || "$path" == languages/ran-ecwid-shop-teaser.pot ]]
                  done <<< "$changed"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add blocks build/blocks languages/ran-ecwid-shop-teaser.pot
                  git diff --cached --quiet && exit 0
                  git commit -m 'style: normalize block sources for shared quality profile'
                  git push origin HEAD:${{ github.event.pull_request.head.ref }}
