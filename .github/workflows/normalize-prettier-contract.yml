name: Normalize shared Prettier contract

on:
    pull_request:

permissions:
    contents: write

jobs:
    normalize:
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.ref == 'chore/adopt-shared-quality-profile'
        runs-on: ubuntu-latest
        steps:
            - name: Check out feature branch
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.5.2

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json

            - name: Install exact Node dependencies
              run: pnpm install --frozen-lockfile

            - name: Normalize only files reported by the shared formatter
              shell: bash
              run: |
                  set -euo pipefail
                  pnpm exec prettier --write \
                    .stylelintrc.json \
                    AGENTS.md \
                    README.md \
                    tests/fixtures/release-lifecycle/pr-files-dependency-locks.json \
                    tests/fixtures/release-lifecycle/recovery-candidate-human.json \
                    tests/fixtures/release-lifecycle/recovery-candidate-moved-head.json \
                    tests/fixtures/release-lifecycle/recovery-candidate-stale.json \
                    tests/fixtures/release-lifecycle/recovery-candidate-valid.json \
                    tests/fixtures/release-lifecycle/ruleset-bypass-actor.json \
                    tests/fixtures/release-lifecycle/ruleset-bypass-capable.json \
                    tests/fixtures/release-lifecycle/ruleset-missing-bypass-actors.json \
                    tests/fixtures/release-lifecycle/ruleset-missing-current-user.json \
                    tests/fixtures/release-lifecycle/ruleset-valid.json

                  converged=false
                  for pass in 1 2 3 4 5; do
                      before="$(sha256sum PRE-RELEASE-CHECKLIST.md | cut -d ' ' -f 1)"
                      pnpm exec prettier --write PRE-RELEASE-CHECKLIST.md
                      after="$(sha256sum PRE-RELEASE-CHECKLIST.md | cut -d ' ' -f 1)"
                      printf 'checklist pass=%s before=%s after=%s\n' "$pass" "$before" "$after"
                      if [[ "$before" == "$after" ]]; then
                          converged=true
                          break
                      fi
                  done
                  test "$converged" = true
                  pnpm format:check

            - name: Commit only formatter-normalization changes
              shell: bash
              run: |
                  set -euo pipefail
                  changed="$(git diff --name-only)"
                  printf '%s\n' "$changed"
                  while IFS= read -r path; do
                      case "$path" in
                          ''|.stylelintrc.json|AGENTS.md|PRE-RELEASE-CHECKLIST.md|README.md|tests/fixtures/release-lifecycle/pr-files-dependency-locks.json|tests/fixtures/release-lifecycle/recovery-candidate-human.json|tests/fixtures/release-lifecycle/recovery-candidate-moved-head.json|tests/fixtures/release-lifecycle/recovery-candidate-stale.json|tests/fixtures/release-lifecycle/recovery-candidate-valid.json|tests/fixtures/release-lifecycle/ruleset-bypass-actor.json|tests/fixtures/release-lifecycle/ruleset-bypass-capable.json|tests/fixtures/release-lifecycle/ruleset-missing-bypass-actors.json|tests/fixtures/release-lifecycle/ruleset-missing-current-user.json|tests/fixtures/release-lifecycle/ruleset-valid.json) ;;
                          *) echo "Unexpected changed path: $path" >&2; exit 1 ;;
                      esac
                  done <<< "$changed"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add \
                    .stylelintrc.json \
                    AGENTS.md \
                    PRE-RELEASE-CHECKLIST.md \
                    README.md \
                    tests/fixtures/release-lifecycle/*.json
                  git diff --cached --quiet && exit 0
                  git commit -m 'style: normalize files for shared Prettier contract'
                  git push origin HEAD:${{ github.event.pull_request.head.ref }}
