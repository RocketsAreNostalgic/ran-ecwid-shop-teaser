name: Refresh quality locks

on:
    pull_request:

permissions:
    contents: write

jobs:
    refresh:
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository
            && github.event.pull_request.head.ref == 'chore/adopt-shared-quality-profile'
        runs-on: ubuntu-latest
        steps:
            - name: Check out feature branch
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.ref }}

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer:v2

            - name: Set up pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
              with:
                  version: 11.5.2

            - name: Set up Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: package.json

            - name: Refresh only quality dependency locks
              run: |
                  composer update \
                    ran/coding-standards \
                    phpcompatibility/php-compatibility \
                    phpcompatibility/phpcompatibility-paragonie \
                    phpcompatibility/phpcompatibility-wp \
                    --with-dependencies --no-interaction --prefer-dist --no-progress
                  pnpm install --lockfile-only

            - name: Prove refreshed locks install exactly
              run: |
                  composer install --no-interaction --prefer-dist --no-progress
                  pnpm install --frozen-lockfile

            - name: Commit generated locks only
              shell: bash
              run: |
                  set -euo pipefail
                  changed="$(git diff --name-only)"
                  printf '%s\n' "$changed"
                  while IFS= read -r path; do
                      [[ -z "$path" || "$path" == composer.lock || "$path" == pnpm-lock.yaml ]]
                  done <<< "$changed"
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git add composer.lock pnpm-lock.yaml
                  git diff --cached --quiet && exit 0
                  git commit -m 'chore: refresh shared quality dependency locks'
                  git push origin HEAD:${{ github.event.pull_request.head.ref }}
